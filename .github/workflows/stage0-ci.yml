name: Stage0 Unit Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py stage0_ingestor.py stage0_fmp_adapter.py stage0_batch.py stage0_daily.py stage0_crypto_probe.py stage0_crypto_history_probe.py stage0_crypto_ingest_prepare.py stage0_crypto_sheet_preflight.py stage0_crypto_commit.py stage0_fmp_cooldown.py stage0_reconcile.py
      - run: python -m unittest discover -p 'test_*.py' -v
      - name: Validate PowerShell runner syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $file = (Resolve-Path scripts/stage0_daily_firetest.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
