name: Stage0 Unit Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py stage0_ingestor.py stage0_fmp_adapter.py stage0_batch.py stage0_daily.py
      - run: python -m unittest discover -p 'test_*.py' -v
