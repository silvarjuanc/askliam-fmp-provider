name: V6.5.1 Stage0 journal recovery safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  safe-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q app.py stage0_ingestor.py stage0_batch.py stage0_fmp_auto_recover.py scripts/stage0_daily_scheduler.py
      - name: Recovery regression tests
        run: python -m unittest discover -s tests -p 'test_stage0_fmp_auto_recover.py' -v
